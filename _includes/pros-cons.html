{% if page.pros or page.cons %}
<div class="pros-cons">
  {% if page.pros %}
  <div class="pc-box pros">
    <h4><i class="fas fa-thumbs-up"></i> What Works</h4>
    <ul>
      {% for item in page.pros %}
      <li>{{ item }}</li>
      {% endfor %}
    </ul>
  </div>
  {% endif %}
  {% if page.cons %}
  <div class="pc-box cons">
    <h4><i class="fas fa-thumbs-down"></i> What Doesn't</h4>
    <ul>
      {% for item in page.cons %}
      <li>{{ item }}</li>
      {% endfor %}
    </ul>
  </div>
  {% endif %}
</div>
{% endif %}
