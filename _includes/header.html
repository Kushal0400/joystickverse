<header id="header" class="header">
  <div class="nav-wrap container">

    <a href="{{ site.baseurl }}/" class="logo" aria-label="JoystickVerse Home">
      <span class="logo-glyph">🎮</span>
      <span class="logo-name">Joystick<em>Verse</em></span>
    </a>

    <nav id="mainNav" class="main-nav" aria-label="Main navigation">
      <a href="{{ site.baseurl }}/" class="nav-item {% if page.url == '/' %}active{% endif %}">Home</a>
      <a href="{{ site.baseurl }}/blog.html" class="nav-item {% if page.url contains 'blog' or page.layout == 'post' %}active{% endif %}">Blog</a>

      <div class="nav-dropdown">
        <button class="nav-item dropdown-trigger" aria-expanded="false" aria-haspopup="true">
          Categories <i class="fas fa-chevron-down"></i>
        </button>
        <div class="dropdown-panel">
          <a href="{{ site.baseurl }}/blog.html" class="dp-item">
            <span class="dp-icon"><i class="fas fa-fist-raised"></i></span>
            <span class="dp-text"><strong>Action</strong><small>7 Articles</small></span>
          </a>
          <a href="#" class="dp-item dp-soon" aria-disabled="true">
            <span class="dp-icon"><i class="fas fa-ghost"></i></span>
            <span class="dp-text"><strong>Horror</strong><small>Coming Soon</small></span>
            <span class="soon-pill">Soon</span>
          </a>
          <a href="#" class="dp-item dp-soon" aria-disabled="true">
            <span class="dp-icon"><i class="fas fa-khanda"></i></span>
            <span class="dp-text"><strong>Mythology</strong><small>Coming Soon</small></span>
            <span class="soon-pill">Soon</span>
          </a>
        </div>
      </div>

      <a href="{{ site.baseurl }}/about.html" class="nav-item {% if page.url contains 'about' %}active{% endif %}">About</a>
      <a href="{{ site.baseurl }}/contact.html" class="nav-item {% if page.url contains 'contact' %}active{% endif %}">Contact</a>
    </nav>

    <div class="nav-controls">
      <button id="themeBtn" class="ctrl-btn" aria-label="Toggle theme">
        <i class="fas fa-moon"></i>
      </button>
      <a href="{{ site.baseurl }}/#newsletter" class="btn-subscribe">
        <i class="fas fa-bell"></i> Subscribe
      </a>
      <button id="mobileToggle" class="mobile-toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
